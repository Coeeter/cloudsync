name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "infra/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task: [check, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.task }}

  artifacts:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun --filter @cloudsync/cloud build
      - uses: actions/upload-artifact@v4
        with:
          name: cloudsync-${{ github.sha }}
          path: |
            apps/cloud/dist/
            apps/cloud/dist-lambda/zip.mjs
          retention-days: 14
