services:
  s3:
    image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    environment:
      initialBuckets: cloudsync-local
      retainFilesOnExit: "true"
      root: /data
    ports: ["54332:9090"]
    volumes: ["cloudsync-s3:/data"]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cloudsync
      POSTGRES_USER: cloudsync
      POSTGRES_PASSWORD: cloudsync
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudsync"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports: ["54329:5432"]
    volumes: ["cloudsync-postgres:/var/lib/postgresql/data"]

volumes:
  cloudsync-s3:
  cloudsync-postgres:
