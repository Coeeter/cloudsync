services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cloudsync
      POSTGRES_USER: cloudsync
      POSTGRES_PASSWORD: cloudsync
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudsync"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports: ["54329:5432"]
    volumes: ["cloudsync-postgres:/var/lib/postgresql/data"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: cloudsync
      MINIO_ROOT_PASSWORD: cloudsync-local-secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports: ["9000:9000", "9001:9001"]
    volumes: ["cloudsync-minio:/data"]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    volumes:
      - ./infra/minio-cors.json:/cors.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 cloudsync cloudsync-local-secret &&
        mc mb --ignore-existing local/cloudsync &&
        mc anonymous set none local/cloudsync &&
        mc cors set local/cloudsync /cors.json

volumes:
  cloudsync-postgres:
  cloudsync-minio:
