name: Release Cloudsync
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        required: true
      release_ref:
        description: Reviewed commit SHA to deploy
        required: true
permissions:
  contents: read
concurrency:
  group: cloudsync-release-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_ENV: ${{ inputs.environment }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dopplerhq/cli-action@v3
      - run: bun install --frozen-lockfile
      - run: bun run check && bun run lint && bun run test
      - name: Build reviewed artifacts
        run: bun --filter @cloudsync/cloud build
      - uses: actions/upload-artifact@v4
        with:
          name: cloudsync-${{ inputs.release_ref }}
          path: |
            apps/cloud/dist/
            apps/cloud/dist-lambda/zip.mjs
          retention-days: 14
      - name: Upload Doppler secrets directly to Wrangler
        working-directory: apps/cloud
        run: |
          set -euo pipefail
          doppler run -- bun scripts/release/secrets.ts | bunx wrangler secret bulk --env '${{ inputs.environment }}'
      - name: Apply reviewed D1 migrations
        working-directory: apps/cloud
        run: bunx wrangler d1 migrations apply cloudsync-${{ inputs.environment }} --remote --env '${{ inputs.environment }}'
      - name: Deploy Worker
        working-directory: apps/cloud
        run: bunx wrangler deploy --env '${{ inputs.environment }}'
      - name: Check deployed Worker health
        working-directory: apps/cloud
        env:
          WORKER_HEALTH_URL: ${{ vars.WORKER_HEALTH_URL }}
        run: bun scripts/release/health.ts
