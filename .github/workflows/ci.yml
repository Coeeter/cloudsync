name: CI and image

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "infra/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task: [check, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.task }}

  image:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/coeeter/cloudsync:latest
            ghcr.io/coeeter/cloudsync:${{ github.sha }}

      # web and worker are separate Dokploy image applications pulling `latest`; their deploy
      # webhooks are only hit after the push above, so neither can pull a stale image.
      - name: Deploy to Dokploy
        run: |
          for url in "$DOKPLOY_WEB_DEPLOY_URL" "$DOKPLOY_WORKER_DEPLOY_URL"; do
            curl --fail-with-body --silent --show-error --retry 3 -X POST "$url"
          done
        env:
          DOKPLOY_WEB_DEPLOY_URL: ${{ secrets.DOKPLOY_WEB_DEPLOY_URL }}
          DOKPLOY_WORKER_DEPLOY_URL: ${{ secrets.DOKPLOY_WORKER_DEPLOY_URL }}
