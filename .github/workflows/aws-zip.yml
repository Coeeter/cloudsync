name: AWS ZIP release
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        required: true
      release_run_id:
        description: Successful CI workflow run containing the reviewed artifact
        required: true
      release_sha:
        description: Exact 40-character commit SHA from that run
        required: true
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: cloudsync-aws-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    environment: aws-${{ inputs.environment }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_bucket_name: ${{ vars.S3_BUCKET }}
      TF_VAR_cloudfront_distribution_id: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      TF_VAR_callback_url: ${{ vars.ZIP_CALLBACK_URL }}
      TF_VAR_artifact_bucket: ${{ vars.ARTIFACT_BUCKET }}
      TF_VAR_secret_parameter: ${{ vars.ZIP_SECRET_PARAMETER }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Verify artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" --jq '.head_sha + " " + .conclusion + " " + .name' > /tmp/provenance
          grep -Fx "$RELEASE_SHA success CI" /tmp/provenance
      - uses: actions/download-artifact@v4
        with:
          name: cloudsync-${{ inputs.release_sha }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/cloudsync-release
      - name: Package and publish immutable Lambda artifact
        run: |
          set -euo pipefail
          python3 apps/cloud/scripts/release/package-zip.py /tmp/cloudsync-release/dist-lambda/zip.mjs /tmp/cloudsync-zip.zip >> "$GITHUB_ENV"
          key="releases/$RELEASE_SHA/zip.zip"
          if aws s3api head-object --bucket "$ARTIFACT_BUCKET" --key "$key" --checksum-mode ENABLED > /tmp/artifact-head 2>/dev/null; then
            python3 -c 'import json,os; assert json.load(open("/tmp/artifact-head"))["ChecksumSHA256"] == os.environ["ZIP_SHA256"]'
          else
            aws s3api put-object --bucket "$ARTIFACT_BUCKET" --key "$key" --body /tmp/cloudsync-zip.zip --if-none-match '*' --checksum-sha256 "$ZIP_SHA256" > /dev/null
          fi
          echo "TF_VAR_artifact_key=$key" >> "$GITHUB_ENV"
      - name: Plan ZIP infrastructure
        working-directory: infra/terraform/zip
        run: |
          terraform init -backend-config="bucket=$STATE_BUCKET" -backend-config="key=cloudsync/$TF_VAR_environment/zip.tfstate" -backend-config=region=ap-southeast-1 -backend-config=use_lockfile=true
          terraform plan -out=/tmp/cloudsync-zip.tfplan
          terraform show -no-color /tmp/cloudsync-zip.tfplan > /tmp/cloudsync-zip-plan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aws-zip-plan
          path: |
            /tmp/cloudsync-zip.tfplan
            /tmp/cloudsync-zip-plan.txt
          retention-days: 7
  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: aws-${{ inputs.environment }}-apply
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      ZIP_SECRET_PARAMETER: ${{ vars.ZIP_SECRET_PARAMETER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ap-southeast-1
      - uses: actions/download-artifact@v4
        with:
          name: aws-zip-plan
          path: /tmp/cloudsync-plan
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dopplerhq/cli-action@v3
      - run: bun install --frozen-lockfile
      - name: Write ZIP secret outside Terraform state
        run: |
          set -euo pipefail
          doppler secrets get ZIP_SERVICE_SECRET --plain | bun apps/cloud/scripts/release/aws-secret.ts
      - name: Apply the reviewed saved plan
        working-directory: infra/terraform/zip
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          terraform init -backend-config="bucket=$STATE_BUCKET" -backend-config="key=cloudsync/$ENVIRONMENT/zip.tfstate" -backend-config=region=ap-southeast-1 -backend-config=use_lockfile=true
          terraform apply /tmp/cloudsync-plan/cloudsync-zip.tfplan
